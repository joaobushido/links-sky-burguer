<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sky's Burguer BH — Encerrado</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #111318; color: #f5f5f5; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 560px); text-align: center; padding: 40px 28px; border: 1px solid #343740; border-radius: 20px; background: #191c22; }
    h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 6vw, 2.5rem); }
    p { margin: 0; color: #c3c6ce; }
    .status { display: inline-block; margin-bottom: 18px; padding: 5px 12px; border-radius: 999px; background: #343740; color: #fff; font-size: .85rem; letter-spacing: .04em; }
  </style>
</head>
<body>
  <main>
    <span class="status">ENCERRADO</span>
    <h1>Sky's Burguer BH</h1>
    <p>Encerramos nossas atividades. Agradecemos de coração a todos que fizeram parte dessa história e apoiaram a Sky's Burguer.</p>
  </main>
</body>
</html>
